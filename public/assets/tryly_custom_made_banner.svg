<svg width="1440" height="260" viewBox="0 0 1440 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="0.46" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1E7FF"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A238FF"/>
      <stop offset="1" stop-color="#5B2BD6"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F27830"/>
      <stop offset="1" stop-color="#FFB347"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2E2252" flood-opacity="0.13"/>
    </filter>
    <filter id="chipShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#A238FF" flood-opacity="0.13"/>
    </filter>
    <style>
      .thai { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 56px; font-weight: 900; fill: #2E2252; letter-spacing: -1.5px; }
      .sub { font-size: 24px; font-weight: 700; fill: #64748B; }
      .tag { font-size: 19px; font-weight: 850; fill: #2E2252; }
      .tiny { font-size: 15px; font-weight: 800; fill: #A238FF; }
    </style>
  </defs>

  <rect width="1440" height="260" rx="38" fill="url(#bg)"/>
  <circle cx="1200" cy="15" r="210" fill="#A238FF" opacity="0.11"/>
  <circle cx="102" cy="252" r="190" fill="#F27830" opacity="0.10"/>
  <path d="M970 218C1085 142 1198 143 1374 176" stroke="#A238FF" stroke-opacity="0.12" stroke-width="30" stroke-linecap="round"/>
  <path d="M778 46C632 86 548 58 405 104" stroke="#F27830" stroke-opacity="0.10" stroke-width="24" stroke-linecap="round"/>

  <g class="thai">
    <rect x="64" y="50" width="194" height="34" rx="17" fill="#FFF1E7" stroke="#FFD4B8"/>
    <text x="88" y="73" font-size="17" font-weight="900" fill="#F27830" letter-spacing="1.5">CUSTOM MADE</text>
    <text x="64" y="134" class="title">สั่งทำได้หลายแบบ</text>
    <text x="68" y="174" class="sub">ไม่ใช่แค่ B2B — ขนม ของชำร่วย แพ็กเกจจิ้ง หรือเฟอร์นิเจอร์ก็เริ่มได้</text>
  </g>

  <g filter="url(#chipShadow)" class="thai">
    <rect x="70" y="198" width="132" height="38" rx="19" fill="#FFFFFF" stroke="#FFE0CC"/>
    <text x="110" y="222" class="tiny">ขนม</text>
    <circle cx="94" cy="217" r="11" fill="#FFF1E7"/>
    <path d="M90 219c6-8 12-8 16 0" stroke="#F27830" stroke-width="3" stroke-linecap="round"/>

    <rect x="218" y="198" width="156" height="38" rx="19" fill="#FFFFFF" stroke="#F0D9FF"/>
    <text x="258" y="222" class="tiny">ของชำร่วย</text>
    <circle cx="242" cy="217" r="11" fill="#F4E8FF"/>
    <path d="M236 214h12v10h-12v-10Zm6 0v10M236 217h12" stroke="#A238FF" stroke-width="2.3" stroke-linecap="round"/>

    <rect x="390" y="198" width="168" height="38" rx="19" fill="#FFFFFF" stroke="#F0D9FF"/>
    <text x="430" y="222" class="tiny">แพ็กเกจจิ้ง</text>
    <circle cx="414" cy="217" r="11" fill="#F4E8FF"/>
    <path d="M408 215l6-4 6 4v8l-6 4-6-4v-8Z" stroke="#A238FF" stroke-width="2.2" stroke-linejoin="round"/>

    <rect x="574" y="198" width="160" height="38" rx="19" fill="#FFFFFF" stroke="#D7F2FF"/>
    <text x="614" y="222" class="tiny">เฟอร์นิเจอร์</text>
    <circle cx="598" cy="217" r="11" fill="#EAF8FF"/>
    <path d="M593 212h10v7h-10v-7Zm1 7v6m8-6v6" stroke="#0284C7" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <g transform="translate(820 32)" filter="url(#softShadow)">
    <ellipse cx="322" cy="182" rx="270" ry="24" fill="#2E2252" opacity="0.08"/>

    <!-- product packaging box -->
    <g transform="translate(330 56)">
      <rect x="0" y="20" width="138" height="130" rx="24" fill="#FFFFFF" stroke="#EFE7FF" stroke-width="3"/>
      <rect x="99" y="20" width="39" height="130" rx="18" fill="url(#orange)"/>
      <path d="M49 72l24-18 24 18v28l-24 18-24-18V72Z" fill="#F27830"/>
      <path d="M61 80c8 8 20 8 28 0" stroke="white" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- cat mascot -->
    <g transform="translate(450 78)">
      <ellipse cx="74" cy="95" rx="55" ry="62" fill="#F7F4F0"/>
      <path d="M38 46L12 18l-4 55 30-27Zm72 0l26-28 4 55-30-27Z" fill="#F27830"/>
      <circle cx="52" cy="82" r="7" fill="#2E2252"/>
      <circle cx="96" cy="82" r="7" fill="#2E2252"/>
      <path d="M72 94l-8-2c3 11 13 11 18 0l-10 2Z" fill="#2E2252"/>
      <path d="M33 100h28M30 112h30M116 100H88M119 112H90" stroke="#2E2252" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
      <rect x="34" y="137" width="78" height="26" rx="13" fill="#6D35DA"/>
      <circle cx="74" cy="150" r="9" fill="#FFB347"/>
    </g>

    <!-- snack pouch -->
    <g transform="translate(160 76) rotate(-8)">
      <path d="M16 0h116l13 142H0L16 0Z" fill="#7C3AED"/>
      <path d="M28 24h84v38H28V24Z" fill="#FFFFFF" opacity="0.93"/>
      <circle cx="72" cy="92" r="25" fill="#FFB347" opacity="0.92"/>
      <path d="M57 92c15-17 30-17 40 0" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- gift box -->
    <g transform="translate(64 112)">
      <rect x="0" y="28" width="110" height="72" rx="18" fill="#FFFFFF" stroke="#F0D9FF" stroke-width="3"/>
      <rect x="45" y="28" width="20" height="72" fill="#A238FF" opacity="0.88"/>
      <rect x="-4" y="16" width="118" height="28" rx="13" fill="#F27830"/>
      <path d="M55 16c-16-24-42-10-26 7 10 10 26-7 26-7Zm0 0c18-23 43-9 26 7-10 10-26-7-26-7Z" fill="#FFCE8A"/>
    </g>

    <!-- wooden stool -->
    <g transform="translate(244 135)">
      <rect x="10" y="0" width="110" height="22" rx="11" fill="#B66A31"/>
      <rect x="24" y="18" width="13" height="75" rx="6" fill="#8B4A24"/>
      <rect x="93" y="18" width="13" height="75" rx="6" fill="#8B4A24"/>
      <rect x="18" y="76" width="96" height="12" rx="6" fill="#C7783A" opacity="0.85"/>
    </g>
  </g>
</svg>
